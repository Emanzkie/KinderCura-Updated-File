<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accept Invitation — KinderCura</title>
  <link rel="stylesheet" href="/css/dashboard-new-styles.css">
  <link rel="stylesheet" href="/css/notifications-styles.css">
  <link rel="stylesheet" href="/notifications-card-ui.css">
  <style>
    .ai-auth-gate {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: calc(100vh - 90px);
      text-align: center; padding: 2rem; gap: 1rem;
    }
    .ai-auth-gate h2 { color: var(--primary); font-size: 1.6rem; }
    .ai-auth-gate p  { color: var(--text-light); max-width: 460px; }
    .ai-auth-buttons { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-top: .5rem; }
    .ai-detail-card {
      background: var(--bg-primary); border-radius: 15px; box-shadow: 0 4px 20px rgba(61, 71, 56, .1);
      padding: 28px 32px; margin-bottom: 1.5rem;
    }
    .ai-child-grid { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
    .ai-child-card { display:flex; align-items:center; gap:10px;
                     background:var(--bg-primary); border:2px solid var(--border);
                     border-radius:10px; padding:10px 14px; }
    .ai-child-avatar { width:38px;height:38px;object-fit:cover;border-radius:50%; }
    .ai-child-name { font-weight:600; color:var(--text-dark); font-size:.95rem; }
    .ai-child-age  { color:var(--text-light); font-size:.82rem; }
    .ai-perm-list { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; }
    .ai-perm-row   { display:flex; align-items:center; gap:7px; font-size:.88rem; }
    .ai-perm-icon  { font-size:.9rem; }
    .ai-status {
      border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem;
      font-weight: 600; font-size: .95rem; display: flex; align-items: center; gap: 8px;
    }
    .ai-status.expired   { background:#F4D89F; border-left:4px solid var(--accent-red); color: var(--text-dark); }
    .ai-status.used      { background:var(--success); border-left:4px solid var(--primary); color: var(--text-dark); }
    .ai-status.invalid   { background:var(--bg-tertiary); border-left:4px solid var(--accent-red); color: var(--text-dark); }
    .ai-status.error     { background:#F4D89F; border-left:4px solid var(--accent-red); color: var(--text-dark); }
    .ai-status.no_token  { background:#DDD9CC; border-left:4px solid var(--border); color: var(--text-dark); }
    .ai-inviter-card { display:flex; align-items:center; gap:14px; padding:14px;
                       background:var(--bg-primary); border:2px solid var(--border); border-radius:10px; margin-top:8px; }
    .ai-inviter-name   { font-weight:700; color:var(--text-dark); font-size:1rem; }
    .ai-inviter-role   { color:var(--text-light); font-size:.9rem; }
    .ai-inviter-email  { color:var(--primary); font-size:.82rem; }
    .ai-spinner { width:22px;height:22px;border:3px solid var(--border);
                   border-top-color:var(--primary);border-radius:50%;
                   animation:ai-spin .7s linear infinite;display:inline-block;vertical-align:middle; }
    @keyframes ai-spin { to { transform:rotate(360deg); } }
    @media(max-width:600px){ .ai-perm-list { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="/css/mobile-nav.css">
    <link rel="stylesheet" href="/css/parent-responsive.css">
</head>
<body>
<header class="top-nav">
  <div class="nav-container">
    <a href="/parent/dashboard" class="logo">
      <img src="/icons/logo.png" alt="KinderCura Logo" class="logo-img">
      <span class="logo-text"><span class="logo-kinder">Kinder</span><span class="logo-cura">Cura</span></span>
    </a>
    <div style="margin-left:auto;display:flex;align-items:center;gap:1rem">
      <span id="aiPageStatus" style="font-size:.88rem;color:var(--text-light)"></span>
    </div>
  </div>
</header>

<main class="dashboard-container">
  <div id="aiMainContent" style="max-width:680px;margin:0 auto;padding-top:1rem"></div>
</main>

<!-- Toast root — lives OUTSIDE #aiMainContent so it survives React re-mounts -->
<div id="aiToastRoot"
     style="position:fixed;top:18px;right:18px;z-index:9999;
            display:flex;flex-direction:column;gap:8px;pointer-events:none">
</div>
<style id="aiToastStyle">
  @keyframes aiSlideIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  #aiToastRoot > div { pointer-events: auto; animation: aiSlideIn .3s ease; cursor: pointer; }
</style>

<script src="/api.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

/* ── Constants ─────────────────────────────────────────────────── */
const REL_LABEL = {
  mother:'Mother',father:'Father',grandparent:'Grandparent',
  legal_guardian:'Legal Guardian',foster_parent:'Foster Parent',
  court_appointed:'Court-Appointed',nanny:'Nanny / Babysitter',
  therapist:'Therapist',teacher:'Teacher',other:'Other',
};
const PERM_LABEL = {
  viewAssessments:'View Assessments & Results',submitAssessments:'Submit Assessments',
  viewResults:'View Assessment Results', viewRecommendations:'View Recommendations',
  uploadDocuments:'Upload Documents & Photos',
  manageAppointments:'Manage Appointments',viewMedicalRecords:'View Medical Records',
  modifyChild:'Modify Child Profile',inviteGuardians:'Invite Other Guardians',
  revokeAccess:'Revoke Access',viewMessages:'View Chat Messages',
  sendMessages:'Send Messages',manageMessages:'Manage Messages',
  viewNotifications:'View Notifications',sendNotifications:'Send Notifications',
  manageNotifications:'Manage Notifications',
};
const FETCH_TIMEOUT_MS = 10000;

/* ── Utilities ─────────────────────────────────────────────────── */
function getToken() {
  return localStorage.getItem('kc_token')?.trim() || localStorage.getItem('token')?.trim() || '';
}
function isLoggedIn() { return !!getToken(); }
function userPayload() {
  try { return JSON.parse(atob(getToken().split('.')[1])); } catch { return null; }
}
function isExpired(inv) { return !!inv?.expiresAt && new Date(inv.expiresAt) < new Date(); }

function abortableFetch(url, opts = {}) {
  const ctrl = new AbortController();
  const id   = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  const res  = fetch(url, { ...opts, signal: ctrl.signal });
  // Do NOT clearTimeout here — we want the abort to fire if the fetch hangs.
  return res;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

/* Maps an HTTP status + body from the guardian API to a page state. */
function errToState(status, body) {
  if (status === 410 || isExpired(body?.invitation))      return { s: 'expired',  m: body?.error || 'This invitation has expired. Please ask the inviter to send a new one.' };
  if (status === 409)                                      return { s: 'used',     m: body?.error || 'This invitation was already accepted.' };
  if (status === 403 && body?.emailMismatch)               return { s: 'mismatch', m: body.error };
  if (status === 404 || !body?.success)                    return { s: 'invalid',  m: body?.error || 'Invalid invitation code. Please check the link and try again.' };
  return { s: 'error', m: body?.error || 'An unexpected error occurred. Please try again.' };
}

function signInAgain() {
  ['kc_token', 'token', 'kc_user', 'kc_childId'].forEach(k => localStorage.removeItem(k));
  window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname + window.location.search);
}

/* "Kemri Soto" or "Kemri Soto, Mia Soto" — names only. */
function childNames(inv) {
  const kids = inv?.children?.length ? inv.children : (inv?.child ? [inv.child] : []);
  const names = kids.map(k => `${k.firstName || ''} ${k.lastName || ''}`.trim()).filter(Boolean);
  return names.length ? names.join(', ') : 'the child';
}

/* viewMedicalRecords is a level ('none' | 'partial' | 'full'), not a boolean. */
function permGranted(v) {
  return typeof v === 'string' ? v !== 'none' : Boolean(v);
}

let _toasts = [];
function addToast(msg, type = 'success', ms = 5000) {
  const id   = Date.now() + Math.random();
  _toasts.push({ id, msg, type });
  renderToasts();
  setTimeout(() => { _toasts = _toasts.filter(t => t.id !== id); renderToasts(); }, ms);
}
function renderToasts() {
  document.getElementById('aiToastRoot').innerHTML = _toasts.map(t =>
    `<div key="${t.id}" role="alert" tabindex="0"
           style="display:flex;align-items:center;gap:8px;min-width:270px;max-width:420px;
                  padding:12px 16px;border-radius:10px;margin-bottom:8px;
                  background:${t.type==='error'?'#E8A5A5':'#A8C49D'};
                  color:#3D4738;font-weight:600;font-size:.9rem;
                  box-shadow:0 4px 18px rgba(61, 71, 56, .18);cursor:pointer"
          onclick="this.remove()">
      <span>${t.type==='error'?'<img src="/icons/smart_notif.png" alt="" aria-hidden="true" style="width:1.1em;height:1.1em;object-fit:contain;vertical-align:-0.18em;">':'<img src="/icons/approve_completed_mark.png" alt="" aria-hidden="true" style="width:1.1em;height:1.1em;object-fit:contain;vertical-align:-0.18em;">'}</span><span>${escapeHtml(t.msg)}</span>
    </div>`
  ).join('');
}

/* ═══════════════════════════════════════════════════════════════
   STATIC DOM HELPER
   Instead of letting React re-render the whole page on every state
   transition, we:
   1. Write the outer HTML elements into #aiMainContent once.
   2. On every state change, only toggle the display of five divs:
        #aiAuthGate | #aiLoading | #aiErrorBox | #aiDetailCard | #aiNoToken
   3. Populate #aiDetailCard with invitation data via direct DOM writes.
   This avoids the "React swallowed my #aiLoading div" bug because
   the divs are static children of #aiMainContent that *React never
   unmounts or recreates* — the component returns <></> (empty
   fragment); React produces zero DOM nodes; all UI lives in the
   static HTML layer above.
═══════════════════════════════════════════════════════════════ */
let _pendingAccept  = null;   // in-flight accept promise (dedup)
let _currentCode    = '';      // stable code ref, set once on mount

/* ── State machine
     PAGE-LOAD    rawCode?  loggedIn?   → state
     ─────────    ────────  ─────────   ──────────────────────────────
     email link   yes       no          → unauthenticated  (auth gate)
     email link   yes       yes         → verifying         (verify API)
     no token     no        *           → no_token          (invalid link)
     manual nav   yes       no          → unauthenticated  (auth gate)
     manual nav   yes       yes         → verifying         (then error)
═══════════════════════════════════════════════════════════════ */
function AcceptInvitation() {
  const [state, setState]           = useState('init');
  const [inv, setInv]               = useState(null);
  const [errMsg, setErrMsg]         = useState('');
  const [busy, setBusy]             = useState(false);

  const rawCode = useMemo(() => {
    try {
      const p = new URLSearchParams(window.location.search);
      return p.get('token') || p.get('code') || '';
    } catch { return ''; }
  }, []);
  /* stable ref — set once here, used everywhere */
  _currentCode = rawCode;

  /* ── New-account form (invitee with no KinderCura account yet) ── */
  const [showSignup, setShowSignup] = useState(false);
  const [form, setForm] = useState({ firstName: '', lastName: '', password: '', confirm: '', acceptTerms: false, acknowledgePrivacy: false, mlConsent: false });
  const [formErr, setFormErr] = useState('');
  const [accountExists, setAccountExists] = useState(false);
  const [confirmationSent, setConfirmationSent] = useState(false);
  const setField = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value }));

  /* Verify the code. The verify endpoint is public, so a signed-out invitee
     still sees who invited them and for which child before choosing what to do. */
  const runVerify = useCallback(async (okState) => {
    setState('verifying');
    try {
      const res  = await abortableFetch(`/api/v2/guardians/verify/${encodeURIComponent(rawCode.trim())}`);
      const body = await res.json().catch(() => ({}));
      if (!res.ok || !body.success) {
        const { s, m } = errToState(res.status, body);
        setState(s); setErrMsg(m);
        return;
      }
      if (isExpired(body.invitation)) { setState('expired'); setErrMsg('This invitation has expired. Please ask the inviter to send a new one.'); return; }
      setInv(body.invitation || body);
      setState(okState);
    } catch (err) {
      setState('error');
      setErrMsg(err.name === 'AbortError'
        ? 'Timeout: connection too slow. Check your internet and reload.'
        : 'Network error. Please check your connection and reload.');
    }
  }, [rawCode]);

  /* ── Mount: token triage ── */
  useEffect(() => {
    if (!rawCode.trim()) { setState('no_token'); return; }
    runVerify(isLoggedIn() ? 'ok' : 'unauthenticated');
  }, [rawCode, runVerify]);

  /* ── Signed in (or out) in another tab: re-check when this tab regains focus ── */
  useEffect(() => {
    function onFocus() {
      if (!rawCode.trim()) return;
      if (state === 'unauthenticated' && isLoggedIn()) runVerify('ok');
      else if (state === 'ok' && !isLoggedIn()) setState('unauthenticated');
    }
    window.addEventListener('focus', onFocus);
    return () => window.removeEventListener('focus', onFocus);
  }, [rawCode, state, runVerify]);

  const handleAccept = useCallback(async () => {
    if (busy || state !== 'ok') return;
    if (_pendingAccept) return;
    _pendingAccept = (async () => {
      setBusy(true);
      try {
        const res  = await abortableFetch('/api/v2/guardians/accept-invitation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getToken()}` },
          body: JSON.stringify({ code: _currentCode }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.success) {
          const { s, m } = errToState(res.status, body);
          setState(s); setErrMsg(m);
          addToast(m, 'error');
          return;
        }
        // Open the dashboard on the child this invitation linked.
        if (Array.isArray(body.childIds) && body.childIds.length) {
          localStorage.setItem('kc_childId', String(body.childIds[0]));
        }
        addToast(`You now have access to ${childNames(inv)}'s profile!`);
        // The confirmation email is sent by the server after the link is saved.
        setTimeout(() => { window.location.href = '/parent/dashboard'; }, 2000);
      } catch (err) {
        const m = err.name === 'AbortError' ? 'Request timed out — please try again.' : 'Network error — please try again.';
        setState('error'); setErrMsg(m);
        addToast(m, 'error');
      } finally { setBusy(false); _pendingAccept = null; }
    })();
  }, [busy, state, inv]);

  const handleCreateAccount = useCallback(async (e) => {
    e.preventDefault();
    if (busy) return;
    setFormErr(''); setAccountExists(false);
    if (!form.firstName.trim() || !form.lastName.trim()) return setFormErr('Please enter your first and last name.');
    if (form.password.length < 8) return setFormErr('Password must be at least 8 characters long.');
    if (form.password !== form.confirm) return setFormErr('The two passwords do not match.');
    if (!form.acceptTerms || !form.acknowledgePrivacy) {
      return setFormErr('Please accept the Terms of Service and acknowledge the Privacy Notice to continue.');
    }
    setBusy(true);
    try {
      const res = await abortableFetch('/api/v2/guardians/accept-new-account', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          code: _currentCode,
          firstName: form.firstName.trim(), lastName: form.lastName.trim(), password: form.password,
          acceptTerms: form.acceptTerms, acknowledgePrivacy: form.acknowledgePrivacy, mlConsent: form.mlConsent,
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || !body.success) {
        if (body.accountExists) { setAccountExists(true); setFormErr(body.error); return; }
        if ([404, 409, 410].includes(res.status)) {
          const { s, m } = errToState(res.status, body);
          setState(s); setErrMsg(m);
          return;
        }
        setFormErr(body.error || 'Could not create your account. Please try again.');
        return;
      }
      setConfirmationSent(body.guardianEmailSent === true);
      setState('created');
    } catch (err) {
      setFormErr(err.name === 'AbortError' ? 'Request timed out — please try again.' : 'Network error — please try again.');
    } finally { setBusy(false); }
  }, [busy, form]);

  const handleDecline = useCallback(() => {
    if (!window.confirm('Decline this invitation? You can ask the inviter to resend it.')) return;
    addToast('Invitation declined.', 'error');
    setTimeout(() => { window.location.href = '/'; }, 1500);
  }, []);

  const goLogin = () => { window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname + window.location.search); };

  /* ── Render based on state ── */
  if (state === 'no_token') {
    return (
      <div className="ai-detail-card">
        <div className="ai-status no_token" role="alert">Invalid Link</div>
        <p style={{color:'var(--text-light)',fontSize:'.92rem',lineHeight:1.6,marginBottom:'14px'}}>
          This invitation link is missing or incomplete. Please use the link from your email to access this page.
        </p>
        <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
          <a href="/" className="btn btn-secondary">Go to Home</a>
          <a href="mailto:support@kindercura.com" className="btn btn-border">Contact Support</a>
        </div>
      </div>
    );
  }

  if (state === 'created') {
    const nm = childNames(inv);
    return (
      <div className="ai-detail-card">
        <div className="ai-status used" role="status">Account created</div>
        <p style={{color:'var(--text-dark)',fontSize:'.95rem',lineHeight:1.6,marginBottom:'14px'}}>
          Your KinderCura account is ready and linked to <strong>{nm}</strong>.
          {confirmationSent ? ` A confirmation was emailed to ${inv?.sentTo || 'you'}.` : ''}
          Sign in with that email and the password you just chose to see {nm} on your dashboard.
        </p>
        <a href="/login" className="btn btn-primary">Sign In</a>
      </div>
    );
  }

  if (state === 'unauthenticated') {
    const nm  = childNames(inv);
    const ivN = inv?.inviterName || 'A KinderCura parent';
    const canSignup = !!inv?.sentTo;
    const inputStyle = {width:'100%',padding:'.75rem .85rem',border:'2px solid var(--border)',borderRadius:'10px',fontSize:'.95rem',fontFamily:'inherit',background:'var(--bg-primary)',color:'var(--text-dark)'};
    const labelStyle = {display:'block',fontWeight:600,fontSize:'.88rem',marginBottom:'.35rem',color:'var(--text-dark)'};
    const checkStyle = {display:'flex',gap:'.6rem',alignItems:'flex-start',fontSize:'.85rem',lineHeight:1.5,color:'var(--text-dark)',marginTop:'.75rem'};
    return (
      <div className="ai-detail-card">
        <h2 style={{color:'var(--primary)',marginBottom:'.35rem'}}>Guardian Invitation</h2>
        <p style={{color:'var(--text-light)',fontSize:'.95rem',marginBottom:'1rem',lineHeight:1.6}}>
          <strong style={{color:'var(--text-dark)'}}>{ivN}</strong> invited you to become a linked guardian for <strong style={{color:'var(--text-dark)'}}>{nm}</strong>
          {inv?.relationshipLabel ? ` as ${inv.relationshipLabel}` : ''}.
          {inv?.sentTo ? <> The invitation was sent to <strong style={{color:'var(--text-dark)'}}>{inv.sentTo}</strong>.</> : null}
        </p>

        {!showSignup ? (
          <>
            <p style={{color:'var(--text-light)',fontSize:'.92rem',lineHeight:1.6,marginBottom:'1rem'}}>
              Already have a KinderCura account with this email? Log in to accept.
              {canSignup ? ' New to KinderCura? Create your account here — you do not need to register a child of your own.' : ''}
            </p>
            <div className="ai-auth-buttons" style={{display:'flex',gap:'1rem',flexWrap:'wrap'}}>
              <button className="btn btn-primary" onClick={goLogin}>Log In</button>
              {canSignup && <button className="btn btn-secondary" onClick={() => setShowSignup(true)}>Create Account</button>}
            </div>
          </>
        ) : (
          <form onSubmit={handleCreateAccount} noValidate autoComplete="off">
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:'1rem'}}>
              <div><label style={labelStyle} htmlFor="aiFirst">First Name</label>
                <input id="aiFirst" style={inputStyle} value={form.firstName} onChange={setField('firstName')} autoComplete="given-name" /></div>
              <div><label style={labelStyle} htmlFor="aiLast">Last Name</label>
                <input id="aiLast" style={inputStyle} value={form.lastName} onChange={setField('lastName')} autoComplete="family-name" /></div>
            </div>
            <div style={{marginTop:'1rem'}}>
              <label style={labelStyle} htmlFor="aiEmail">Email</label>
              <input id="aiEmail" style={{...inputStyle,background:'var(--bg-secondary)'}} value={inv?.sentTo || ''} readOnly />
              <span style={{display:'block',fontSize:'.78rem',color:'var(--text-light)',marginTop:'.3rem'}}>Your account uses the email this invitation was sent to.</span>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:'1rem',marginTop:'1rem'}}>
              <div><label style={labelStyle} htmlFor="aiPass">Password</label>
                <input id="aiPass" type="password" style={inputStyle} value={form.password} onChange={setField('password')} autoComplete="new-password" placeholder="Min 8 characters" /></div>
              <div><label style={labelStyle} htmlFor="aiPass2">Confirm Password</label>
                <input id="aiPass2" type="password" style={inputStyle} value={form.confirm} onChange={setField('confirm')} autoComplete="new-password" /></div>
            </div>

            <label style={checkStyle}>
              <input type="checkbox" checked={form.acceptTerms} onChange={setField('acceptTerms')} style={{marginTop:'.2rem',accentColor:'var(--primary)'}} />
              <span>I have read, understood, and agree to the KinderCura Terms of Service. I understand that KinderCura is a developmental assessment and monitoring support system and does not provide medical diagnosis, treatment, therapy, or emergency medical services. <em>(Required)</em></span>
            </label>
            <label style={checkStyle}>
              <input type="checkbox" checked={form.acknowledgePrivacy} onChange={setField('acknowledgePrivacy')} style={{marginTop:'.2rem',accentColor:'var(--primary)'}} />
              <span>I have read and understood the KinderCura Privacy Notice and acknowledge the information provided regarding the collection, processing, storage, access, sharing, retention, and protection of personal information. <em>(Required)</em></span>
            </label>
            <p style={{fontSize:'.82rem',marginTop:'.5rem'}}>
              <a href="/legal/KINDERCURA-TERMS-OF-SERVICE.txt" target="_blank" rel="noopener" style={{color:'var(--primary)'}}>Review the Terms of Service</a>
            </p>
            <label style={checkStyle}>
              <input type="checkbox" checked={form.mlConsent} onChange={setField('mlConsent')} style={{marginTop:'.2rem',accentColor:'var(--primary)'}} />
              <span>I voluntarily consent to the use of eligible information that I submit through KinderCura for the training, testing, evaluation, research, and improvement of KinderCura's machine learning models, subject to the KinderCura Privacy Notice and applicable data privacy requirements. I understand that this consent is optional and may be withdrawn subject to applicable law and the procedures provided by KinderCura. <em>(Optional)</em></span>
            </label>

            {formErr ? (
              <div role="alert" style={{marginTop:'1rem',padding:'10px 14px',borderLeft:'4px solid var(--accent-red)',background:'var(--bg-tertiary)',borderRadius:'8px',fontSize:'.88rem',color:'var(--text-dark)'}}>
                {formErr}
                {accountExists ? <div style={{marginTop:'.5rem'}}><button type="button" className="btn btn-secondary" onClick={goLogin}>Log In Instead</button></div> : null}
              </div>
            ) : null}

            <div style={{display:'flex',gap:'10px',flexWrap:'wrap',marginTop:'1.25rem'}}>
              <button type="submit" className="btn btn-primary" disabled={busy} style={{opacity: busy ? 0.6 : 1}}>
                {busy ? 'Creating account…' : 'Create Account & Accept'}
              </button>
              <button type="button" className="btn btn-secondary" onClick={() => { setShowSignup(false); setFormErr(''); }} disabled={busy}>Back</button>
            </div>
          </form>
        )}
      </div>
    );
  }

  if (state === 'verifying' || state === 'accepting') {
    return (
      <div style={{textAlign:'center',padding:'3rem 1rem',color:'var(--text-light)'}}>
        <div className="ai-spinner" style={{width:'32px',height:'32px',marginBottom:'12px'}}></div>
        <p>{state === 'accepting' ? 'Accepting invitation\u2026' : 'Verifying invitation\u2026'}</p>
        <p style={{fontSize:'.82rem',marginTop:'6px'}}>This can take up to 10 seconds.</p>
      </div>
    );
  }

  if (['expired', 'used', 'invalid', 'error', 'mismatch'].includes(state)) {
    const cfg = ((s) => {
      switch(s) {
        case 'expired':  return {cls:'expired', title:'Invitation Expired',     msg: errMsg || 'This invitation has expired. Please ask the inviter to send a new one.'};
        case 'used':     return {cls:'used',    title:'Invitation Already Used', msg: errMsg || 'This invitation was already accepted.'};
        case 'mismatch': return {cls:'invalid', title:'Different Account',       msg: errMsg};
        case 'invalid':  return {cls:'invalid', title:'Invalid Invitation',      msg: errMsg || 'Invalid invitation code. Check your email or contact the inviter.'};
        default:         return {cls:'error',   title:'Error',                   msg: errMsg || 'An unexpected error occurred.'};
      }
    })(state);
    return (
      <div className="ai-detail-card">
        <div className={`ai-status ${cfg.cls}`} role="alert">{cfg.title}</div>
        <p style={{color:'var(--text-light)',fontSize:'.92rem',lineHeight:1.6}}>{cfg.msg}</p>
        <div style={{display:'flex',gap:'10px',flexWrap:'wrap',marginTop:'14px'}}>
          {state === 'used' && (isLoggedIn()
            ? <a href="/parent/dashboard" className="btn btn-primary">Go to Dashboard</a>
            : <a href="/login" className="btn btn-primary">Log In</a>)}
          {state === 'mismatch' && <button onClick={signInAgain} className="btn btn-primary">Sign in with a different account</button>}
          {state === 'error' && <button onClick={() => window.location.reload()} className="btn btn-secondary">Try Again</button>}
          {(state === 'expired' || state === 'invalid') && <a href="/" className="btn btn-secondary">Go to Home</a>}
          {state === 'expired' && <a href="mailto:support@kindercura.com" className="btn btn-border">Contact Support</a>}
        </div>
      </div>
    );
  }

  if (state === 'ok' && inv) {
    const fc  = inv.child?.firstName   || inv.children?.[0]?.firstName || '';
    const lc  = inv.child?.lastName    || inv.children?.[0]?.lastName  || '';
    const nm  = `${fc} ${lc}`.trim()    || 'Child';
    const ivN = inv.inviterName || inv.createdByName || 'A KinderCura user';
    const ivR = REL_LABEL[inv.relationship] || 'Guardian';
    const ivE = inv.inviterEmail || inv.createdByEmail || '';
    const ph  = inv.inviterPhoto || inv.createdByPhoto;
    const kids = inv.children || (inv.child ? [inv.child] : []);
    const perms = inv.permissions || inv.customPermissions || {};
    const lbl  = (() => {
      if (!inv.expiresAt) return 'No expiration';
      const d = new Date(inv.expiresAt), ms = d - Date.now();
      if (ms < 0)                    return 'Expired';
      const days = Math.floor(ms / 86400000), hrs = Math.floor((ms % 86400000) / 3600000);
      return days > 0 ? `Expires in ${days}d ${hrs}h` : `Expires in ${hrs}h`;
    })();

    return (
      <div className="ai-detail-card">
        <h2 style={{color:'var(--primary)',marginBottom:'.25rem'}}>Guardian Invitation</h2>
        <p style={{color:'var(--text-light)',fontSize:'.95rem',marginBottom:'1.25rem'}}>
          You've been invited to access {nm}'s profile on KinderCura
        </p>

        <div style={{fontSize:'.82rem',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.06em',color:'var(--text-light)',marginBottom:'6px'}}>Invited by</div>
        <div className="ai-inviter-card" style={{display:'flex',alignItems:'center',gap:'14px',padding:'14px',background:'var(--bg-primary)',border:'2px solid var(--border)',borderRadius:'10px',marginTop:'8px'}}>
          {ph
            ? <img src={ph} alt="" style={{width:'48px',height:'48px',objectFit:'cover',borderRadius:'50%'}}/>
            : <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:'48px',height:'48px',borderRadius:'50%',background:'#6B8E6F',color:'#fafaf6',fontWeight:'700',fontSize:'1.2rem'}}>{(ivN||'?')[0].toUpperCase()}</span>
          }
          <div style={{marginLeft:'14px'}}>
            <div className="ai-inviter-name" style={{fontWeight:'700',color:'var(--text-dark)',fontSize:'1rem'}}>{ivN}</div>
            <div className="ai-inviter-role" style={{color:'var(--text-light)',fontSize:'.9rem'}}>Invites you as {ivR}</div>
            {ivE ? <div className="ai-inviter-email" style={{color:'var(--primary)',fontSize:'.82rem'}}>{ivE}</div> : null}
          </div>
        </div>

        <div style={{marginTop:'1.5rem'}}>
          <div style={{fontSize:'.82rem',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.06em',color:'var(--text-light)',marginBottom:'6px'}}>Children</div>
          <div className="ai-child-grid" style={{display:'flex',flexWrap:'wrap',gap:'10px',marginTop:'10px'}}>
            {kids.map(k => (
              <div key={k.id || k._id} className="ai-child-card" style={{display:'flex',alignItems:'center',gap:'10px',background:'var(--bg-primary)',border:'2px solid var(--border)',borderRadius:'10px',padding:'10px 14px'}}>
                {(k.profileIcon && k.profileIcon !== 'child1' && !k.profileIcon.startsWith('http'))
                  ? <img src={window.location.origin + k.profileIcon} alt="" style={{width:'38px',height:'38px',objectFit:'cover',borderRadius:'50%'}} onError={(e) => e.target.style.display='none'}/>
                  : <div style={{width:'38px',height:'38px',borderRadius:'50%',background:'#F4D89F',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.2rem'}}><img src="/icons/child.png" alt="" aria-hidden="true" style={{width:'24px',height:'24px',objectFit:'contain'}}/></div>
                }
                <div>
                  <div className="ai-child-name" style={{fontWeight:'600',color:'var(--text-dark)',fontSize:'.95rem'}}>{k.firstName||''} {k.lastName||''}</div>
                  {k.dateOfBirth ? <div className="ai-child-age" style={{color:'var(--text-light)',fontSize:'.82rem'}}>Age {Math.max(0,Math.round((Date.now()-new Date(k.dateOfBirth.split('T')[0]))/31557600000))}</div> : null}
                </div>
              </div>
            ))}
          </div>
        </div>

        <div style={{marginTop:'1.5rem'}}>
          <div style={{fontSize:'.82rem',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.06em',color:'var(--text-light)',marginBottom:'6px'}}>Access Permissions</div>
          <div className="ai-perm-list" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px',marginTop:'10px'}}>
            {Object.entries(perms).map(([k,v]) => (
              <div key={k} className="ai-perm-row" style={{display:'flex',alignItems:'center',gap:'7px',fontSize:'.88rem'}}>
                <span className="ai-perm-icon" style={{fontSize:'.9rem'}}><img src={permGranted(v) ? '/icons/approve_completed_mark.png' : '/icons/cancelled_mark.png'} alt="" aria-hidden="true" style={{width:'1.1em',height:'1.1em',objectFit:'contain',verticalAlign:'-0.18em'}} /></span>
                <span>{PERM_LABEL[k] || k}</span>
              </div>
            ))}
          </div>
        </div>

        {inv.personalMessage ? (
          <div style={{marginTop:'1.5rem'}}>
            <div style={{fontSize:'.82rem',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.06em',color:'var(--text-light)',marginBottom:'6px'}}>Message from inviter</div>
            <div style={{background:'var(--bg-primary)',border:'2px solid var(--border)',borderRadius:'8px',padding:'12px 14px',fontSize:'.92rem',fontStyle:'italic',color:'var(--text-dark)',lineHeight:1.6}}>{inv.personalMessage}</div>
          </div>
        ) : null}

        <div style={{marginTop:'1.25rem',padding:'10px 14px',background:'#F4D89F',borderRadius:'8px',fontSize:'.85rem',color:'#3D4738',display:'flex',alignItems:'center',gap:'8px'}}>
          This invitation <strong>{lbl}</strong>
        </div>

        <div style={{marginTop:'2rem',display:'flex',gap:'10px',flexWrap:'wrap'}}>
          <button className="btn btn-primary" onClick={handleAccept} disabled={busy}
                  style={{fontSize:'1.05rem',padding:'.9rem 2rem',opacity: busy ? 0.6 : 1}}>
            {busy ? 'Processing\u2026' : 'Accept'}
          </button>
          <button className="btn btn-secondary" onClick={handleDecline}
                  style={{borderColor:'var(--accent-red,#E8A5A5)',color:'var(--accent-red,#3D4738)'}}>
            Decline
          </button>
        </div>

        <div style={{marginTop:'1rem',padding:'12px 16px',background:'#FAFAF6',borderRadius:'10px',border:'1px solid var(--border)',fontSize:'.82rem',color:'var(--text-light)',lineHeight:1.55}}>
          This email was sent directly by <strong>{ivN}</strong>. For support, contact <a href="mailto:support@kindercura.com" style={{color:'var(--primary)'}}>support@kindercura.com</a>.
        </div>
      </div>
    );
  }

  return (
    <div style={{textAlign:'center',padding:'3rem 1rem',color:'var(--text-light)'}}>
      <div className="ai-spinner" style={{width:'32px',height:'32px',marginBottom:'12px'}}></div>
      <p>Loading\u2026</p>
    </div>
  );
}

/* ── Mount ──────────────────────────────────────────────────── */
const root = document.getElementById('aiMainContent');
if (root) {
  ReactDOM.createRoot(root).render(React.createElement(AcceptInvitation));
}
</script>
</body>
</html>
