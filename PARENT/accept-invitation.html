<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accept Invitation — KinderCura</title>
  <link rel="stylesheet" href="/css/dashboard-new-styles.css">
  <link rel="stylesheet" href="/css/notifications-styles.css">
  <link rel="stylesheet" href="/notifications-card-ui.css">
  <style>
    .ai-auth-gate {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: calc(100vh - 90px);
      text-align: center; padding: 2rem; gap: 1rem;
    }
    .ai-auth-gate h2 { color: var(--primary); font-size: 1.6rem; }
    .ai-auth-gate p  { color: var(--text-light); max-width: 460px; }
    .ai-auth-buttons { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-top: .5rem; }
    .ai-detail-card {
      background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,.1);
      padding: 28px 32px; margin-bottom: 1.5rem;
    }
    .ai-child-grid { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
    .ai-child-card { display:flex; align-items:center; gap:10px;
                     background:var(--bg-primary); border:2px solid var(--border);
                     border-radius:10px; padding:10px 14px; }
    .ai-child-avatar { width:38px;height:38px;object-fit:cover;border-radius:50%; }
    .ai-child-name { font-weight:600; color:var(--text-dark); font-size:.95rem; }
    .ai-child-age  { color:var(--text-light); font-size:.82rem; }
    .ai-perm-list { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; }
    .ai-perm-row   { display:flex; align-items:center; gap:7px; font-size:.88rem; }
    .ai-perm-icon  { font-size:.9rem; }
    .ai-status {
      border-radius: 10px; padding: 14px 18px; margin-bottom: 1.5rem;
      font-weight: 600; font-size: .95rem; display: flex; align-items: center; gap: 8px;
    }
    .ai-status.expired   { background:#F4D89F; border-left:4px solid #D4897A; color: var(--text-dark); }
    .ai-status.used      { background:#c8e6c9; border-left:4px solid #388e3c; color: var(--text-dark); }
    .ai-status.invalid   { background:#ffcdd2; border-left:4px solid #c62828; color: var(--text-dark); }
    .ai-status.error     { background:#F4D89F; border-left:4px solid #D4897A; color: var(--text-dark); }
    .ai-status.no_token  { background:#DDD9CC; border-left:4px solid #9e9e9e; color: var(--text-dark); }
    .ai-inviter-card { display:flex; align-items:center; gap:14px; padding:14px;
                       background:var(--bg-primary); border:2px solid var(--border); border-radius:10px; margin-top:8px; }
    .ai-inviter-name   { font-weight:700; color:var(--text-dark); font-size:1rem; }
    .ai-inviter-role   { color:var(--text-light); font-size:.9rem; }
    .ai-inviter-email  { color:var(--primary); font-size:.82rem; }
    .ai-spinner { width:22px;height:22px;border:3px solid var(--border);
                   border-top-color:var(--primary);border-radius:50%;
                   animation:ai-spin .7s linear infinite;display:inline-block;vertical-align:middle; }
    @keyframes ai-spin { to { transform:rotate(360deg); } }
    @media(max-width:600px){ .ai-perm-list { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<header class="top-nav">
  <div class="nav-container">
    <a href="/parent/dashboard.html" class="logo">
      <img src="/icons/logo.png" alt="KinderCura Logo" class="logo-img">
      <span class="logo-text"><span class="logo-kinder">Kinder</span><span class="logo-cura">Cura</span></span>
    </a>
    <div style="margin-left:auto;display:flex;align-items:center;gap:1rem">
      <span id="aiPageStatus" style="font-size:.88rem;color:var(--text-light)"></span>
    </div>
  </div>
</header>

<main class="dashboard-container">
  <div id="aiMainContent" style="max-width:680px;margin:0 auto;padding-top:1rem"></div>
</main>

<!-- Toast root — lives OUTSIDE #aiMainContent so it survives React re-mounts -->
<div id="aiToastRoot"
     style="position:fixed;top:18px;right:18px;z-index:9999;
            display:flex;flex-direction:column;gap:8px;pointer-events:none">
</div>
<style id="aiToastStyle">
  @keyframes aiSlideIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  #aiToastRoot > div { pointer-events: auto; animation: aiSlideIn .3s ease; cursor: pointer; }
</style>

<script src="/api.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

/* ── Constants ─────────────────────────────────────────────────── */
const REL_LABEL = {
  mother:'Mother',father:'Father',grandparent:'Grandparent',
  legal_guardian:'Legal Guardian',foster_parent:'Foster Parent',
  court_appointed:'Court-Appointed',nanny:'Nanny / Babysitter',
  therapist:'Therapist',teacher:'Teacher',other:'Other',
};
const PERM_LABEL = {
  viewAssessments:'View Assessments & Results',submitAssessments:'Submit Assessments',
  viewResults:'View Assessment Results', uploadDocuments:'Upload Documents & Photos',
  manageAppointments:'Manage Appointments',viewMedicalRecords:'View Medical Records',
  modifyChild:'Modify Child Profile',inviteGuardians:'Invite Other Guardians',
  revokeAccess:'Revoke Access',viewMessages:'View Chat Messages',
  sendMessages:'Send Messages',manageMessages:'Manage Messages',
  viewNotifications:'View Notifications',sendNotifications:'Send Notifications',
  manageNotifications:'Manage Notifications',
};
const FETCH_TIMEOUT_MS = 10000;

/* ── Utilities ─────────────────────────────────────────────────── */
function getToken() {
  return localStorage.getItem('kc_token')?.trim() || localStorage.getItem('token')?.trim() || '';
}
function isLoggedIn() { return !!getToken(); }
function userPayload() {
  try { return JSON.parse(atob(getToken().split('.')[1])); } catch { return null; }
}
function isExpired(inv) { return !!inv?.expiresAt && new Date(inv.expiresAt) < new Date(); }

function abortableFetch(url, opts = {}) {
  const ctrl = new AbortController();
  const id   = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  const res  = fetch(url, { ...opts, signal: ctrl.signal });
  clearTimeout(id);
  return res;
}

let _toasts = [];
function addToast(msg, type = 'success', ms = 5000) {
  const id   = Date.now() + Math.random();
  _toasts.push({ id, msg, type });
  renderToasts();
  setTimeout(() => { _toasts = _toasts.filter(t => t.id !== id); renderToasts(); }, ms);
}
function renderToasts() {
  document.getElementById('aiToastRoot').innerHTML = _toasts.map(t =>
    `<div key="${t.id}" role="alert" tabindex="0"
           style="display:flex;align-items:center;gap:8px;min-width:270px;max-width:420px;
                  padding:12px 16px;border-radius:10px;margin-bottom:8px;
                  background:${t.type==='error'?'#E8A5A5':'#A8C49D'};
                  color:#3D4738;font-weight:600;font-size:.9rem;
                  box-shadow:0 4px 18px rgba(0,0,0,.18);cursor:pointer"
          onclick="this.remove()">
      <span>${t.type==='error'?'⚠️':'✅'}</span><span>${t.msg}</span>
    </div>`
  ).join('');
}

/* ═══════════════════════════════════════════════════════════════
   STATIC DOM HELPER
   Instead of letting React re-render the whole page on every state
   transition, we:
   1. Write the outer HTML elements into #aiMainContent once.
   2. On every state change, only toggle the display of five divs:
        #aiAuthGate | #aiLoading | #aiErrorBox | #aiDetailCard | #aiNoToken
   3. Populate #aiDetailCard with invitation data via direct DOM writes.
   This avoids the "React swallowed my #aiLoading div" bug because
   the divs are static children of #aiMainContent that *React never
   unmounts or recreates* — the component returns <></> (empty
   fragment); React produces zero DOM nodes; all UI lives in the
   static HTML layer above.
═══════════════════════════════════════════════════════════════ */
renderStaticShell();

let _pendingAccept  = null;   // in-flight accept promise (dedup)
let _currentCode    = '';      // stable code ref, set once on mount

function renderStaticShell() {
  const c = document.getElementById('aiMainContent');

  c.innerHTML = `
    <div id="aiAuthGate" class="ai-auth-gate" style="display:none">
      <h2>👋 Accept a Guardian Invitation</h2>
      <p id="aiAuthSub">Sign in to your KinderCura account to accept this invitation.</p>
      <div class="ai-auth-buttons" id="aiAuthBtns"></div>
    </div>

    <div id="aiNoToken" class="ai-detail-card" style="display:none">
      <div class="ai-status no_token" role="alert">🔗 Invalid Link</div>
      <p style="color:var(--text-light);font-size:.92rem;line-height:1.6;margin-bottom:14px">
        This invitation link is missing or incomplete. Please use the link from your
        email to access this page.
      </p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a href="/"                class="btn btn-secondary">Go to Home</a>
        <a href="mailto:support@kindercura.com" class="btn btn-border">Contact Support</a>
      </div>
    </div>

    <div id="aiLoading" style="display:none;text-align:center;padding:3rem 1rem;color:var(--text-light)">
      <div class="ai-spinner" style="width:32px;height:32px;margin-bottom:12px"></div>
      <p>Verifying invitation…</p>
      <p style="font-size:.82rem;margin-top:6px">This can take up to 10 seconds.</p>
    </div>

    <div id="aiErrorBox" class="ai-detail-card" style="display:none">
      <div id="aiErrorHeader" class="ai-status" role="alert"></div>
      <p  id="aiErrorBody"   style="color:var(--text-light);font-size:.92rem;line-height:1.6"></p>
      <div id="aiErrorActions" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"></div>
    </div>

    <div id="aiDetailCard" class="ai-detail-card" style="display:none">
      <h2 style="color:var(--primary);margin-bottom:.25rem">Guardian Invitation</h2>
      <p id="aiSubtitle" style="color:var(--text-light);font-size:.95rem;margin-bottom:1.25rem"></p>

      <div style="font-size:.82rem;font-weight:700;text-transform:uppercase;
                  letter-spacing:.06em;color:var(--text-light);margin-bottom:6px">Invited by</div>
      <div id="aiInviter"></div>

      <div style="margin-top:1.5rem">
        <div style="font-size:.82rem;font-weight:700;text-transform:uppercase;
                    letter-spacing:.06em;color:var(--text-light);margin-bottom:6px">Child${'ren'}</div>
        <div id="aiChildGrid" class="ai-child-grid"></div>
      </div>

      <div style="margin-top:1.5rem">
        <div style="font-size:.82rem;font-weight:700;text-transform:uppercase;
                    letter-spacing:.06em;color:var(--text-light);margin-bottom:6px">Access Permissions</div>
        <div id="aiPermList" class="ai-perm-list"></div>
      </div>

      <div id="aiPersonalWrap" style="display:none;margin-top:1.5rem">
        <div style="font-size:.82rem;font-weight:700;text-transform:uppercase;
                    letter-spacing:.06em;color:var(--text-light);margin-bottom:6px">Message from inviter</div>
        <div style="background:var(--bg-primary);border:2px solid var(--border);border-radius:8px;
                    padding:12px 14px;font-size:.92rem;font-style:italic;
                    color:var(--text-dark);line-height:1.6" id="aiPersonalMsg"></div>
      </div>

      <div style="margin-top:1.25rem;padding:10px 14px;background:#F4D89F;border-radius:8px;
                  font-size:.85rem;color:#3D4738;display:flex;align-items:center;gap:8px">
        ⏰ This invitation <strong id="aiExpiryLabel"></strong>
      </div>

      <div id="aiActions" style="margin-top:2rem;display:flex;gap:10px;flex-wrap:wrap"></div>

      <div style="margin-top:1rem;padding:12px 16px;background:white;border-radius:10px;
                  border:1px solid var(--border);font-size:.82rem;color:var(--text-light);line-height:1.55">
        🛡️ This email was sent directly by
        <strong id="aiSecInviter"></strong>.
        For support, contact <a href="mailto:support@kindercura.com"
        style="color:var(--primary)">support@kindercura.com</a>.
      </div>
    </div>
  `;
}

/* ── State machine
     PAGE-LOAD    rawCode?  loggedIn?   → state
     ─────────    ────────  ─────────   ──────────────────────────────
     email link   yes       no          → unauthenticated  (auth gate)
     email link   yes       yes         → verifying         (verify API)
     no token     no        *           → no_token          (invalid link)
     manual nav   yes       no          → unauthenticated  (auth gate)
     manual nav   yes       yes         → verifying         (then error)
═══════════════════════════════════════════════════════════════ */
function AcceptInvitation() {
  const [state, setState]           = useState('init');
  const [inv, setInv]               = useState(null);
  const [errMsg, setErrMsg]         = useState('');
  const [busy, setBusy]             = useState(false);

  const rawCode = useMemo(() => {
    try { return new URLSearchParams(window.location.search).get('code') || ''; }
    catch { return ''; }
  }, []);
  /* stable ref — set once here, used everywhere */
  _currentCode = rawCode;

  /* ── Mount: token triage ── */
  useEffect(() => {
    /* ── 1. No token at all — static error box ── */
    if (!rawCode.trim()) {
      setState('no_token');
      return;
    }
    /* ── 2. Token but not logged in — auth gate, preserve token in URL ── */
    if (!isLoggedIn()) {
      setState('unauthenticated');
      return;
    }
    /* ── 3. Token + logged in — verify immediately ── */
    (async () => {
      setState('verifying');
      try {
        const res  = await abortableFetch(`/api/v2/guardians/verify/${encodeURIComponent(rawCode.trim())}`);
        const body = await res.json();

        if (!res.ok || !body.success) {
          if (res.status === 410 || isExpired(body?.invitation))      setState('expired');
          else if (res.status === 409)                                  setState('used');
          else if (res.status === 404 || !body.success)                 setState('invalid');
          else                                                           setState('error');
          setErrMsg(body.error || 'An unknown error occurred.');
          return;
        }
        /* server said ok — double-check expiry on our side */
        if (isExpired(body.invitation)) { setState('expired'); setErrMsg('Invitation expired.'); return; }
        setInv(body.invitation || body);
        setState('ok');
      } catch (err) {
        if (err.name === 'AbortError') {
          setState('error'); setErrMsg('Timeout: connection too slow. Check your internet and reload.');
        } else {
          setState('error'); setErrMsg('Network error. Please check your connection and reload.');
        }
      }
    })();
  }, [rawCode]);

  /* ── Re-verify when tab regains focus (handler may have returned a stale session) ── */
  useEffect(() => {
    function onFocus() {
      if (!rawCode.trim()) return;
      if (!isLoggedIn()) {
        setState('unauthenticated');
        return;
      }
      if (state === 'unauthenticated') {
        (async () => {
          setState('verifying');
          try {
            const res  = await abortableFetch(`/api/v2/guardians/verify/${encodeURIComponent(rawCode.trim())}`);
            const body = await res.json();
            if (!res.ok || !body.success) {
              if (res.status === 410 || isExpired(body?.invitation)) setState('expired');
              else if (res.status === 409)                            setState('used');
              else                                                    setState('invalid');
              setErrMsg(body.error || 'Invitation no longer valid.');
              return;
            }
            if (isExpired(body.invitation)) { setState('expired'); setErrMsg('Expired.'); return; }
            setInv(body.invitation || body);
            setState('ok');
          } catch {
            setState('error'); setErrMsg('Network error on re-check.');
          }
        })();
      }
    }
    window.addEventListener('focus', onFocus);
    return () => window.removeEventListener('focus', onFocus);
  }, [rawCode, state]);

  /* ═══════════════════════════════════════════════════════════════
     STATIC DOM BRIDGE
     React renders <></> (empty fragment). Every visual decision is
     made here by toggling display on the five static divs that
     renderStaticShell() placed inside #aiMainContent.
  ═══════════════════════════════════════════════════════════════ */
  useEffect(() => {
    const S = {
      loading:    document.getElementById('aiLoading'),
      errorBox:   document.getElementById('aiErrorBox'),
      errorHdr:   document.getElementById('aiErrorHeader'),
      errorBody:  document.getElementById('aiErrorBody'),
      errorAct:   document.getElementById('aiErrorActions'),
      detail:     document.getElementById('aiDetailCard'),
      authGate:   document.getElementById('aiAuthGate'),
      noToken:    document.getElementById('aiNoToken'),
    };
    if (!S.loading) return;   // shell not mounted yet

    S.loading.style.display   = 'none';
    S.errorBox.style.display  = 'none';
    S.detail.style.display    = 'none';
    S.noToken.style.display   = 'none';

    switch (state) {
      case 'no_token':
        S.noToken.style.display = '';
        break;

      case 'unauthenticated': {
        S.authGate.style.display = 'flex';
        const sub   = document.getElementById('aiAuthSub');
        const btns  = document.getElementById('aiAuthBtns');
        if (sub)  sub.textContent   = 'Sign in to your KinderCura account to accept this invitation and access the child\'s profile, appointments, and medical records.';
        if (btns) btns.innerHTML    = `
          <button class="btn btn-primary"
                  onclick="window.location.href='/login.html?next='+encodeURIComponent(window.location.pathname+window.location.search)">
            🔐 Log In
          </button>
          <button class="btn btn-secondary"
                  onclick="window.location.href='/signup.html?next='+encodeURIComponent(window.location.pathname+window.location.search)">
            📝 Create Account
          </button>`;
        break;
      }

      case 'verifying':
        S.loading.style.display = 'block';
        break;

      case 'expired':
        S.errorBox.style.display   = '';
        S.errorHdr.className       = 'ai-status expired';
        S.errorHdr.textContent     = '⏰ Invitation Expired';
        S.errorBody.textContent    = errMsg || 'This invitation has expired. Please ask the inviter to send a new one.';
        S.errorAct.innerHTML       = `<a href="/" class="btn btn-secondary">Go to Home</a>
                                       <a href="mailto:support@kindercura.com" class="btn btn-border">Contact Support</a>`;
        break;

      case 'used':
        S.errorBox.style.display   = '';
        S.errorHdr.className       = 'ai-status used';
        S.errorHdr.textContent     = '✅ Already Accepted';
        S.errorBody.textContent    = 'This invitation was already accepted. You already have access to this profile.';
        S.errorAct.innerHTML       = `<a href="/parent/dashboard.html" class="btn btn-primary">Go to Dashboard</a>`;
        break;

      case 'invalid':
        S.errorBox.style.display   = '';
        S.errorHdr.className       = 'ai-status invalid';
        S.errorHdr.textContent     = '❌ Invalid Invitation';
        S.errorBody.textContent    = errMsg || 'Invalid invitation code. Check your email or contact the inviter.';
        S.errorAct.innerHTML       = `<a href="/" class="btn btn-secondary">Go to Home</a>`;
        break;

      case 'error':
        S.errorBox.style.display   = '';
        S.errorHdr.className       = 'ai-status error';
        S.errorHdr.textContent     = '⚠️ Error';
        S.errorBody.textContent    = errMsg || 'An unexpected error occurred.';
        S.errorAct.innerHTML       = `<button onclick="window.location.reload()" class="btn btn-secondary">Try Again</button>`;
        break;

      case 'ok':
        S.detail.style.display = '';
        renderDetailCard(inv);
        break;

      case 'accepting':
        S.loading.style.display = 'block';
        break;
    }
  }, [state, inv, errMsg]);

  /* ── Accept ── */
  const handleAccept = useCallback(async () => {
    if (busy || state !== 'ok') return;
    if (_pendingAccept) return;        // dedup
    _pendingAccept = (async () => {
      setBusy(true);
      try {
        const res  = await abortableFetch('/api/v2/guardians/accept-invitation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getToken()}` },
          body: JSON.stringify({ code: _currentCode }),
        });
        const body = await res.json();
        if (!res.ok || !body.success) {
          addToast(body.error || 'Failed to accept invitation.', 'error');
          return;
        }
        const fc   = inv?.child?.firstName   || inv?.children?.[0]?.firstName || 'Child';
        const lc   = inv?.child?.lastName    || inv?.children?.[0]?.lastName  || '';
        const name = `${fc} ${lc}`.trim();
        addToast(`✅ You now have access to ${name}'s profile!`);

        // fire-and-forget emails (best-effort)
        try {
          const ud  = userPayload() || {};
          const myN = `${ud.firstName||''} ${ud.lastName||''}`.trim();
          const inN = inv?.createdByName || inv?.inviterName   || '';
          const inE = inv?.inviterEmail  || '';
          abortableFetch('/api/v2/guardians/invitations/accept-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getToken()}` },
            body: JSON.stringify({
              invitationId: inv?.id || inv?.invitation?.id,
              inviterName: inN, inviterEmail: inE,
              acceptorName: myN, acceptorEmail: ud.email, childName: name,
            }),
          }).catch(() => {});
        } catch { /* best-effort */ }

        setTimeout(() => { window.location.href = '/parent/dashboard.html'; }, 2000);
      } catch (err) {
        addToast(err.name === 'AbortError'
          ? 'Request timed out — please try again.'
          : 'Network error — please try again.', 'error');
      } finally { setBusy(false); _pendingAccept = null; }
    })();
  }, [busy, state, inv]);

  const handleDecline = useCallback(() => {
    if (!window.confirm('Decline this invitation? You can ask the inviter to resend it.')) return;
    addToast('Invitation declined.', 'error');
    setTimeout(() => { window.location.href = '/'; }, 1500);
  }, []);

  /* ── Build detail card into the static DOM ── */
  function renderDetailCard(data) {
    if (!data)  return;

    const fc  = data.child?.firstName   || data.children?.[0]?.firstName || '';
    const lc  = data.child?.lastName    || data.children?.[0]?.lastName  || '';
    const nm  = `${fc} ${lc}`.trim()    || 'Child';

    document.getElementById('aiSubtitle').textContent = `You've been invited to access ${nm}'s profile on KinderCura`;

    /* inviter */
    const ivN = data.inviterName || data.createdByName || 'A KinderCura user';
    const ivR = REL_LABEL[data.relationship] || 'Guardian';
    const ivE = data.inviterEmail || data.createdByEmail || '';
    const ph  = data.inviterPhoto || data.createdByPhoto;
    const ivEl = document.getElementById('aiInviter');
    ivEl.innerHTML = ph
      ? `<img src="${ph}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:50%"/>`
      : `<span style="display:inline-flex;align-items:center;justify-content:center;
                      width:48px;height:48px;border-radius:50%;background:#6B8E6F;
                      color:#fff;font-weight:700;font-size:1.2rem">
           ${(ivN||'?')[0].toUpperCase()}
         </span>`;
    ivEl.innerHTML += `<div style="margin-left:14px">
      <div class="ai-inviter-name">${ivN}</div>
      <div class="ai-inviter-role">${ivR}</div>
      ${ivE ? `<div class="ai-inviter-email">${ivE}</div>` : ''}
    </div>`;

    /* children */
    const kids = data.children || (data.child ? [data.child] : []);
    document.getElementById('aiChildGrid').innerHTML = kids.map(k => {
      const p = k.profileIcon && k.profileIcon !== 'child1' && !k.profileIcon.startsWith('http')
                ? window.location.origin + k.profileIcon : null;
      return `<div class="ai-child-card">
        ${p
          ? `<img src="${p}" alt="" style="width:38px;height:38px;object-fit:cover;border-radius:50%" onerror="this.style.display='none'"/>`
          : `<div style="width:38px;height:38px;border-radius:50%;background:#F4D89F;
                        display:flex;align-items:center;justify-content:center;font-size:1.2rem">👶</div>`
        }
        <div class="ai-child-info">
          <div class="ai-child-name">${k.firstName||''} ${k.lastName||''}</div>
          ${k.dateOfBirth
            ? `<div class="ai-child-age">Age ${Math.max(0,Math.round((Date.now()-new Date(k.dateOfBirth.split('T')[0]))/31557600000))}</div>`
            : ''}
        </div>
      </div>`;
    }).join('');

    /* permissions */
    const perms = data.permissions || data.customPermissions || {};
    document.getElementById('aiPermList').innerHTML = Object.entries(perms).map(([k,v]) =>
      `<div class="ai-perm-row"><span class="ai-perm-icon">${v?'✅':'⬜'}</span><span>${PERM_LABEL[k]||k}</span></div>`
    ).join('');

    /* personal message */
    const pmWrap = document.getElementById('aiPersonalWrap');
    const pmEl   = document.getElementById('aiPersonalMsg');
    if (data.personalMessage) {
      pmWrap.style.display = ''; pmEl.textContent = data.personalMessage;
    } else {
      pmWrap.style.display = 'none';
    }

    /* expiry */
    const lbl  = (() => {
      if (!data.expiresAt) return 'No expiration';
      const d = new Date(data.expiresAt), ms = d - Date.now();
      if (ms < 0)                    return 'Expired';
      const days = Math.floor(ms / 86400000), hrs = Math.floor((ms % 86400000) / 3600000);
      return days > 0 ? `Expires in ${days}d ${hrs}h` : `Expires in ${hrs}h`;
    })();
    document.getElementById('aiExpiryLabel').textContent = lbl;
    document.getElementById('aiSecInviter').textContent  = ivN;

    /* action buttons */
    document.getElementById('aiActions').innerHTML = `
      <button class="btn btn-primary" onclick="window._aiAccept()"
              style="font-size:1.05rem;padding:.9rem 2rem">
        ✅ Accept Invitation
      </button>
      <button class="btn btn-secondary" onclick="window._aiDecline()"
              style="border-color:var(--accent-red,#D4897A);color:var(--accent-red,#D4897A)">
        Decline
      </button>
    `;
    window._aiAccept  = handleAccept;
    window._aiDecline = handleDecline;
  }

  /* React renders nothing — all DOM is driven by the static-layer bridge above */
  return <React.Fragment />;
}

/* ── Mount ──────────────────────────────────────────────────── */
const root = document.getElementById('aiMainContent');
if (root) {
  ReactDOM.createRoot(root).render(React.createElement(AcceptInvitation));
}
</script>
</body>
</html>
