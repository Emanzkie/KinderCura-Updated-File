<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Guardian Management - KinderCura</title>
  <link rel="stylesheet" href="/css/dashboard-new-styles.css">
  <link rel="stylesheet" href="/css/notifications-styles.css">
  <link rel="stylesheet" href="/notifications-card-ui.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="top-nav">
  <div class="nav-container">
    <a href="/parent/dashboard.html" class="logo">
      <img src="/icons/logo.png" alt="KinderCura Logo" class="logo-img">
      <span class="logo-text"><span class="logo-kinder">Kinder</span><span class="logo-cura">Cura</span></span>
    </a>
    <nav class="main-nav">
      <a href="/parent/dashboard.html" class="nav-link">Dashboard</a>
      <a href="/parent/results.html" class="nav-link">Results</a>
      <a href="/parent/recommendations.html" class="nav-link">Recommendations</a>
      <a href="/parent/appointments.html" class="nav-link">Appointments</a>
      <a href="/parent/chat.html" class="nav-link">Chat</a>
      <a href="/parent/custom-questions.html" class="nav-link">Questions</a>
    </nav>
    <div class="nav-right">
      <button class="icon-btn notification-btn" onclick="openNotifications()">
        <img src="/icons/notif_bell.png" class="notification-icon" style="width:24px;height:24px;"> <span id="notifCount" class="notification-badge">0</span>
      </button>
      <button class="icon-btn profile-btn" onclick="toggleProfileMenu()">
        <img src="/icons/profile.png" class="profile-icon" id="navProfilePic">
      </button>
    </div>
  </div>
</header>

<main class="dashboard-container" style="padding-top:1rem;">
  <div id="guardian-management-root"></div>
</main>

<!-- ═══════════════════════════════════════════════════════════
     Permission Edit Modal
     ═══════════════════════════════════════════════════════════ -->
<div id="gmPermModal" style="display:none">
  <div id="gmPermOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;
    display:flex;align-items:center;justify-content:center"
    onclick="gmClosePermModal()"></div>
  <div id="gmPermContent" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:white;border-radius:15px;box-shadow:0 8px 36px rgba(0,0,0,.18);
    width:min(580px,94vw);max-height:86vh;overflow-y:auto;padding:28px;z-index:9001"
    role="dialog" aria-modal="true" aria-label="Edit Guardian Permissions">
    <button onclick="gmClosePermModal()"
      style="background:none;border:none;font-size:1.3rem;cursor:pointer;float:right;line-height:1"
      aria-label="Close">&times;</button>
    <h3 id="gmPermTitle" style="color:var(--primary);margin-bottom:6px"></h3>
    <p id="gmPermSub" style="color:var(--text-light);font-size:0.88rem;margin-bottom:18px"></p>
    <div id="gmPermToggles"></div>
    <div id="gmPermImpact" style="margin-top:14px;padding:10px 14px;background:var(--bg-primary);
      border:1px solid var(--border);border-radius:8px;font-size:0.86rem;color:var(--text-light)"></div>
    <div style="margin-top:22px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="gmClosePermModal()">Cancel</button>
      <button class="btn btn-primary" onclick="gmSavePerms()">Save Permissions</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     Transfer-Primary Confirmation Modal
     ═══════════════════════════════════════════════════════════ -->
<div id="gmTransferModal" style="display:none">
  <div id="gmTransferOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;
    display:flex;align-items:center;justify-content:center"
    onclick="gmCloseTransferModal()"></div>
  <div id="gmTransferContent" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:white;border-radius:15px;box-shadow:0 8px 36px rgba(0,0,0,.18);
    width:min(480px,94vw);padding:28px;z-index:9001"
    role="dialog" aria-modal="true" aria-label="Transfer Primary Guardian">
    <button onclick="gmCloseTransferModal()"
      style="background:none;border:none;font-size:1.3rem;cursor:pointer;float:right;line-height:1"
      aria-label="Close">&times;</button>
    <h3 style="color:var(--primary);margin-bottom:6px">Transfer Primary Guardian</h3>
    <p id="gmTransferBody" style="color:var(--text-light);font-size:0.9rem;margin-bottom:20px;line-height:1.6"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="gmCloseTransferModal()">Cancel</button>
      <button id="gmTransferConfirmBtn" class="btn btn-primary">Confirm Transfer</button>
    </div>
  </div>
</div>

<script src="/api.js"></script>
<script src="/notifications-card-ui.js"></script>

<!-- React + Babel (development, CDN) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
// ==================== Guardian Management Component ====================
const { useState, useEffect, useMemo, useCallback } = React;

const KC_CHILD_KEY = 'kc_childId';

function getUrlChildId() {
  const params = new URLSearchParams(window.location.search);
  return String(params.get('childId') || '');
}

function getStoredChildId() {
  return String(localStorage.getItem(KC_CHILD_KEY) || '');
}

function getInitialChildId() {
  return getUrlChildId() || getStoredChildId();
}

function persistChildId(id) {
  if (id) localStorage.setItem(KC_CHILD_KEY, String(id));
  else localStorage.removeItem(KC_CHILD_KEY);
}

function resolveSelectedChild(kids, storedId) {
  if (kids.length === 0) return '';
  const match = storedId && kids.find(c => String(c.id || c._id) === String(storedId));
  if (match) return String(match.id || match._id);
  return String(kids[0].id || kids[0]._id);
}

// Static lookup tables
const RELATIONSHIP_OPTIONS = [
  { value: 'mother', label: 'Mother' },
  { value: 'father', label: 'Father' },
  { value: 'grandparent', label: 'Grandparent' },
  { value: 'legal_guardian', label: 'Legal Guardian' },
  { value: 'foster_parent', label: 'Foster Parent' },
  { value: 'court_appointed', label: 'Court-Appointed' },
  { value: 'nanny', label: 'Nanny / Babysitter' },
  { value: 'therapist', label: 'Therapist' },
  { value: 'teacher', label: 'Teacher' },
  { value: 'other', label: 'Other' },
];

const PERMISSION_PRESETS = [
  { value: 'full', label: 'Full Access', icon: '🔓' },
  { value: 'standard', label: 'Standard Access', icon: '⚖️' },
  { value: 'medical', label: 'Medical Only', icon: '🏥' },
  { value: 'limited', label: 'Limited Access', icon: '🔒' },
  { value: 'custom', label: 'Custom', icon: '⚙️' },
];

const PERMISSION_DEFINITIONS = [
  { key: 'viewAssessments', label: 'View Assessments & Results', icon: '📊' },
  { key: 'submitAssessments', label: 'Submit Assessments', icon: '✏️' },
  { key: 'viewResults', label: 'View Assessment Results', icon: '📈' },
  { key: 'uploadDocuments', label: 'Upload Documents & Photos', icon: '📷' },
  { key: 'manageAppointments', label: 'Manage Appointments', icon: '📅' },
  { key: 'viewMedicalRecords', label: 'View Medical Records', icon: '💊' },
  { key: 'modifyChild', label: 'Modify Child Profile', icon: '👤' },
  { key: 'inviteGuardians', label: 'Invite Other Guardians', icon: '➕' },
  { key: 'revokeAccess', label: 'Revoke Access', icon: '❌' },
  { key: 'viewMessages', label: 'View Chat Messages', icon: '💬' },
  { key: 'sendMessages', label: 'Send Messages', icon: '🗨️' },
  { key: 'viewNotifications', label: 'View Notifications', icon: '🔔' },
];

// ===== Main Component =====
function GuardianManagement() {
  const [children, setChildren] = useState([]);
  const [selectedChild, setSelectedChild] = useState(getInitialChildId);
  const [invitationEmail, setInvitationEmail] = useState('');
  const [invitationRelationship, setInvitationRelationship] = useState('legal_guardian');
  const [invitationPreset, setInvitationPreset] = useState('standard');
  const [invitationMessage, setInvitationMessage] = useState('');
  const [customPermissions, setCustomPermissions] = useState({});
  const [showCustomPerms, setShowCustomPerms] = useState(false);
  const [pendingInvitations, setPendingInvitations] = useState([]);
  const [linkedGuardians, setLinkedGuardians] = useState([]);
  const [editingGuardian, setEditingGuardian] = useState(null);
  const [transferTarget, setTransferTarget] = useState(null);
  const [message, setMessage] = useState({ text: '', type: '' });
  const [loading, setLoading] = useState(false);
  const [childrenLoading, setChildrenLoading] = useState(true);

  const token = localStorage.getItem('token');

  // Computed: selected-child summary for the context bar below
  const selectedChildInfo = useMemo(() => {
    if (!selectedChild) return null;
    return children.find(c =>
      String(c.id || c._id) === String(selectedChild)
    ) || null;
  }, [children, selectedChild]);

  // Set page title once children are loaded
  useEffect(() => {
    try { document.title = children.length
      ? `Guardians — ${children[0].firstName} ${children[0].lastName} | KinderCura`
      : 'Guardian Management — KinderCura'; } catch {}
  }, [children]);

  // Persist selected child to localStorage on change
  useEffect(() => {
    persistChildId(selectedChild);
  }, [selectedChild]);

  // Sync selectedChild when kc_childId changes in another tab
  useEffect(() => {
    function handleStorageChange(e) {
      if (e.key !== KC_CHILD_KEY || !e.newValue) return;
      if (e.newValue === selectedChild) return;
      if (children.length === 0) return;
      const match = children.find(c => String(c.id || c._id) === String(e.newValue));
      if (match) setSelectedChild(String(match.id || match._id));
    }
    window.addEventListener('storage', handleStorageChange);
    return () => window.removeEventListener('storage', handleStorageChange);
  }, [children, selectedChild]);

  // Load children on mount & auto-select in one pass
  useEffect(() => {
    if (!token) {
      setChildrenLoading(false);
      return;
    }

    let cancelled = false;

    fetch('/api/children', { headers: { Authorization: `Bearer ${token}` } })
      .then(r => r.json())
      .then(d => {
        if (cancelled) return;
        const kids = Array.isArray(d?.children) ? d.children : [];
        const urlId = getUrlChildId();
        const stored = urlId || getStoredChildId();
        const resolvedId = resolveSelectedChild(kids, stored);

        setChildren(kids);
        setSelectedChild(resolvedId);
        if (resolvedId) persistChildId(resolvedId);
        setChildrenLoading(false);
      })
      .catch(() => {
        if (!cancelled) {
          setChildren([]);
          setChildrenLoading(false);
        }
      });

    return () => { cancelled = true; };
  }, [token]);

  // Load pending invitations
  useEffect(() => {
    if (!token) return;
    fetch('/api/v2/guardians/pending-invitations', { headers: { Authorization: `Bearer ${token}` } })
      .then(r => r.json())
      .then(d => setPendingInvitations(d.invitations || []))
      .catch(() => setPendingInvitations([]));
  }, [token]);

  // Load linked guardians when child selected
  useEffect(() => {
    if (!selectedChild || !token) {
      setLinkedGuardians([]);
      return;
    }
    fetch(`/api/v2/guardians/children/${selectedChild}/guardians`, {
      headers: { Authorization: `Bearer ${token}` },
    })
      .then(r => r.json())
      .then(d => setLinkedGuardians(d.guardians || []))
      .catch(() => setLinkedGuardians([]));
  }, [selectedChild, token]);

  // Permission preset presets
  useEffect(() => {
    const presets = {
      full: { viewAssessments: true, submitAssessments: true, viewResults: true,
                uploadDocuments: true, manageAppointments: true, viewMedicalRecords: true,
                modifyChild: true, inviteGuardians: true, revokeAccess: true,
                viewMessages: true, sendMessages: true, viewNotifications: true },
      standard: { viewAssessments: true, viewResults: true, viewMessages: true, viewNotifications: true },
      medical: { viewMedicalRecords: true, manageAppointments: true },
      limited: { viewResults: true },
    };
    if (invitationPreset !== 'custom' && presets[invitationPreset]) {
      setCustomPermissions(presets[invitationPreset]);
    }
  }, [invitationPreset]);

  const handleInvite = async (e) => {
    e.preventDefault();
    if (!selectedChild) return setMessage({ text: 'Select a child first.', type: 'error' });
    if (!invitationEmail) return setMessage({ text: 'Enter an email to invite.', type: 'error' });
    setLoading(true);
    try {
      const res = await fetch('/api/v2/guardians/generate-invitation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({
          childIds: [selectedChild],
          inviteEmail: invitationEmail,
          relationship: invitationRelationship,
          permissionPreset: invitationPreset,
          customPermissions: invitationPreset === 'custom' ? customPermissions : undefined,
          personalMessage: invitationMessage,
        }),
      });
      const body = await res.json();
      if (res.ok && body.success) {
        setMessage({ text: `Invitation sent! Code: ${body.invitationCode}`, type: 'success' });
        setInvitationEmail('');
        setInvitationMessage('');
        // Refresh pending list
        fetch('/api/v2/guardians/pending-invitations', { headers: { Authorization: `Bearer ${token}` } })
          .then(r => r.json())
          .then(d => setPendingInvitations(d.invitations || []));
      } else {
        setMessage({ text: body.error || 'Failed to send invitation', type: 'error' });
      }
    } catch (err) {
      setMessage({ text: 'Network error. Try again.', type: 'error' });
    }
    setLoading(false);
  };

  const handleResend = async (id) => {
    try {
      const res = await fetch(`/api/v2/guardians/invitations/${id}/resend`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
      });
      const body = await res.json();
      if (res.ok) {
        setMessage({ text: 'Invitation resent!', type: 'success' });
        fetch('/api/v2/guardians/pending-invitations', { headers: { Authorization: `Bearer ${token}` } })
          .then(r => r.json())
          .then(d => setPendingInvitations(d.invitations || []));
      }
    } catch {
      setMessage({ text: 'Failed to resend', type: 'error' });
    }
  };

  const handleRevokeInvite = async (id) => {
    if (!confirm('Revoke this invitation?')) return;
    try {
      const res = await fetch(`/api/v2/guardians/invitations/${id}/revoke`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
      });
      if (res.ok) {
        setPendingInvitations(p => p.filter(i => i.id !== id));
      }
    } catch {
      setMessage({ text: 'Failed to revoke invitation', type: 'error' });
    }
  };

  const openPermissionEditor = (guardian) => {
    setEditingGuardian(guardian);
  };

  const handleTransferPrimary = async (guardianId) => {
    if (!window.confirm('Transfer primary guardian status to this user? They will become the main contact.')) return;
    try {
      const res = await fetch(`/api/v2/guardians/children/${selectedChild}/transfer-primary`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ targetGuardianId: guardianId }),
      });
      const body = await res.json();
      if (res.ok) {
        setMessage({ text: 'Primary guardian transferred.', type: 'success' });
        // Refresh guardians list
        fetch(`/api/v2/guardians/children/${selectedChild}/guardians`, {
          headers: { Authorization: `Bearer ${token}` },
        })
          .then(r => r.json())
          .then(d => setLinkedGuardians(d.guardians || []));
      } else {
        setMessage({ text: body.error || 'Transfer failed', type: 'error' });
      }
    } catch {
      setMessage({ text: 'Network error during transfer', type: 'error' });
    }
  };

  // Permission modal handlers (window-level for inline onclick)
  window.gmOpenPermModal = (guardian) => {
    setEditingGuardian(guardian);
    document.getElementById('gmPermModal').style.display = 'block';
  };
  window.gmClosePermModal = () => {
    setEditingGuardian(null);
    document.getElementById('gmPermModal').style.display = 'none';
  };

  // Transfer modal handlers
  window.gmOpenTransferModal = (guardian) => {
    setTransferTarget(guardian);
    const name = guardian.name || 'this user';
    document.getElementById('gmTransferBody').textContent = `${name} will become the primary guardian. You will retain access but they will be listed as the primary contact.`;
    document.getElementById('gmTransferModal').style.display = 'block';
  };
  window.gmCloseTransferModal = () => {
    setTransferTarget(null);
    document.getElementById('gmTransferModal').style.display = 'none';
  };

  // Render permission toggles for editing
  useEffect(() => {
    if (editingGuardian) {
      const container = document.getElementById('gmPermToggles');
      container.innerHTML = PERMISSION_DEFINITIONS.map(p => `
        <label style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
          <input type="checkbox" data-key="${p.key}" ${editingGuardian.permissions?.[p.key] ? 'checked' : ''}
            onchange="window.gmUpdatePermPreview()" />
          <span>${p.icon}</span><span>${p.label}</span>
        </label>
      `).join('');
      window.gmUpdatePermPreview = () => {
        const checked = Array.from(container.querySelectorAll('input:checked')).map(i => i.dataset.key);
        document.getElementById('gmPermImpact').textContent = checked.length
          ? 'This will allow: ' + checked.map(k => PERMISSION_DEFINITIONS.find(p => p.key === k)?.label || k).join(', ') + '.'
          : 'No permissions selected.';
      };
      window.gmUpdatePermPreview();
      document.getElementById('gmPermTitle').textContent = `Edit Permissions for ${editingGuardian.name}`;
    }
  }, [editingGuardian]);

  window.gmSavePerms = async () => {
    if (!editingGuardian) return;
    const container = document.getElementById('gmPermToggles');
    const newPerms = {};
    PERMISSION_DEFINITIONS.forEach(p => {
      const el = container.querySelector(`input[data-key="${p.key}"]`);
      if (el) newPerms[p.key] = el.checked;
    });
    try {
      const res = await fetch(`/api/v2/guardians/children/${selectedChild}/guardians/${editingGuardian.id}/permissions`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ permissions: newPerms }),
      });
      if (res.ok) {
        setMessage({ text: 'Permissions updated.', type: 'success' });
        // Refresh guardians
        fetch(`/api/v2/guardians/children/${selectedChild}/guardians`, {
          headers: { Authorization: `Bearer ${token}` },
        })
          .then(r => r.json())
          .then(d => setLinkedGuardians(d.guardians || []));
        window.gmClosePermModal();
      } else {
        setMessage({ text: 'Failed to update permissions', type: 'error' });
      }
    } catch {
      setMessage({ text: 'Network error', type: 'error' });
    }
  };

  window.gmConfirmTransfer = async () => {
    if (transferTarget) {
      await handleTransferPrimary(transferTarget.id);
      window.gmCloseTransferModal();
    }
  };

  return (
    <div>
      {/* ===== Child Selector Bar ===== */}
      <div style={{
        background: 'white',
        borderRadius: 12,
        padding: '16px 20px',
        marginBottom: 20,
        boxShadow: '0 2px 8px rgba(0,0,0,0.08)',
        display: 'flex',
        alignItems: 'center',
        gap: 16,
        flexWrap: 'wrap',
      }}>
        <span style={{
          fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.07em',
          color: '#6B7967', flexShrink: 0,
        }}>Managing guardians for</span>

        {childrenLoading ? (
          <span style={{ color: '#888', fontSize: 13 }}>⏳ Loading children...</span>
        ) : children.length > 1 ? (
          <select
            value={selectedChild}
            onChange={(e) => setSelectedChild(e.target.value)}
            disabled={childrenLoading}
            style={{
              padding: '8px 12px', borderRadius: 8, border: '2px solid var(--border)',
              fontSize: 14, fontWeight: 600, minWidth: 200, flexShrink: 0,
            }}
          >
            {children.map((c) => (
              <option key={c.id || c._id} value={c.id || c._id}>
                {c.firstName} {c.lastName}
              </option>
            ))}
          </select>
        ) : selectedChildInfo ? (
          /* Selected-child mini card for single child */
          <div style={{
            display: 'flex', alignItems: 'center', gap: 10,
            background: 'var(--bg-primary)', border: '2px solid var(--border)',
            borderRadius: 10, padding: '8px 14px', flexShrink: 0,
          }}>
            {selectedChildInfo.profileIcon && selectedChildInfo.profileIcon !== 'child1' &&
             !selectedChildInfo.profileIcon.startsWith('http') ? (
              <img
                src={window.location.origin + selectedChildInfo.profileIcon}
                alt=""
                style={{ width: 36, height: 36, objectFit: 'cover', borderRadius: '50%' }}
                onError={(e) => { e.target.style.display = 'none'; }}
              />
            ) : (
              <div style={{
                width: 36, height: 36, borderRadius: '50%', background: '#F4D89F',
                display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16,
              }}>👶</div>
            )}
            <div>
              <div style={{ fontWeight: 700, fontSize: 14, color: '#3D4738' }}>
                {selectedChildInfo.firstName} {selectedChildInfo.lastName}
              </div>
              {selectedChildInfo.dateOfBirth && (
                <div style={{ fontSize: 12, color: '#6B7967' }}>
                  Age {Math.max(0, Math.round((Date.now() - new Date(selectedChildInfo.dateOfBirth.split('T')[0])) / 31557600000))} yrs
                </div>
              )}
            </div>
          </div>
        ) : null}

        <span style={{
          fontSize: 12, color: '#6B7967', marginLeft: 'auto',
          background: '#F4D89F', borderRadius: 6, padding: '4px 10px',
        }}>
          Guardians shown below are tied to this child
        </span>
      </div>

      {/* ===== Invite Section ===== */}
      <div style={{ background: '#fafafa', padding: 16, borderRadius: 10, marginBottom: 24 }}>
        <h3 style={{ margin: '0 0 4px', color: 'var(--primary)' }}>
          {selectedChildInfo
            ? `Send Invitation for ${selectedChildInfo.firstName} ${selectedChildInfo.lastName}`
            : 'Invite a Guardian'}
        </h3>
        {selectedChildInfo && (
          <p style={{ margin: '0 0 12px', color: 'var(--text-light)', fontSize: 12 }}>
            This invitation will be sent for <strong>{selectedChildInfo.firstName} {selectedChildInfo.lastName}</strong>.
            Switch the selected child above using the selector on the right.
          </p>
        )}
        <form onSubmit={handleInvite}>
          <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', alignItems: 'flex-end' }}>
            <div>
              <label style={{ fontSize: 12, fontWeight: 600 }}>Email</label>
              <input type="email" value={invitationEmail} onChange={e => setInvitationEmail(e.target.value)}
                placeholder="guardian@example.com" required style={{ padding: 8, minWidth: 220 }} />
            </div>
            <div>
              <label style={{ fontSize: 12, fontWeight: 600 }}>Relationship</label>
              <select value={invitationRelationship} onChange={e => setInvitationRelationship(e.target.value)} style={{ padding: 8 }}>
                {RELATIONSHIP_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
              </select>
            </div>
          </div>
          <div style={{ marginTop: 12 }}>
            <label style={{ fontSize: 12, fontWeight: 600 }}>Permission Preset</label>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 4 }}>
              {PERMISSION_PRESETS.map(p => (
                <button type="button" key={p.value}
                  onClick={() => { setInvitationPreset(p.value); setShowCustomPerms(p.value === 'custom'); }}
                  style={{ padding: '6px 12px', border: invitationPreset === p.value ? '2px solid var(--primary)' : '1px solid var(--border)',
                    background: invitationPreset === p.value ? 'var(--bg-primary)' : 'white', borderRadius: 6, cursor: 'pointer' }}>
                  {p.icon} {p.label}
                </button>
              ))}
            </div>
          </div>
          {showCustomPerms && (
            <div style={{ marginTop: 12 }}>
              <label style={{ fontSize: 12, fontWeight: 600 }}>Custom Permissions</label>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 8, marginTop: 6 }}>
                {PERMISSION_DEFINITIONS.map(p => (
                  <label key={p.key} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13 }}>
                    <input type="checkbox" checked={!!customPermissions[p.key]}
                      onChange={e => setCustomPermissions({ ...customPermissions, [p.key]: e.target.checked })} />
                    <span>{p.icon}</span><span>{p.label}</span>
                  </label>
                ))}
              </div>
            </div>
          )}
          <div style={{ marginTop: 12 }}>
            <label style={{ fontSize: 12, fontWeight: 600 }}>Personal Message (optional)</label>
            <textarea value={invitationMessage} onChange={e => setInvitationMessage(e.target.value)}
              placeholder="Add a note for the invitee..." rows={2} style={{ width: '100%', padding: 8, borderRadius: 6, marginTop: 4 }} />
          </div>
          <button type="submit" disabled={loading || childrenLoading} className="btn btn-primary" style={{ marginTop: 12 }}>
            {childrenLoading ? 'Loading...' : loading ? 'Sending...' : 'Send Invitation'}
          </button>
        </form>
      </div>

      {/* ===== Pending Invitations ===== */}
      <div style={{ marginBottom: 24 }}>
        <h3 style={{ margin: '0 0 12px', color: 'var(--primary)' }}>Pending Invitations</h3>
        {pendingInvitations.length === 0 ? <p style={{ color: 'var(--text-light)' }}>No pending invitations.</p> :
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead>
              <tr style={{ background: 'var(--bg-primary)' }}>
                <th style={{ padding: 10, textAlign: 'left' }}>Email</th>
                <th style={{ padding: 10, textAlign: 'left' }}>Relationship</th>
                <th style={{ padding: 10, textAlign: 'left' }}>Status</th>
                <th style={{ padding: 10, textAlign: 'left' }}>Expires In</th>
                <th style={{ padding: 10, textAlign: 'left' }}>Actions</th>
              </tr>
            </thead>
            <tbody>
              {pendingInvitations.map(inv => {
                const isExp = inv.isExpired;
                const daysLeft = inv.daysLeft;
                return (
                  <tr key={inv.id} style={{ borderTop: '1px solid var(--border)' }}>
                    <td style={{ padding: 10 }}>{inv.sentTo || '—'}</td>
                    <td style={{ padding: 10 }}>{RELATIONSHIP_OPTIONS.find(r => r.value === inv.relationship)?.label || inv.relationship}</td>
                    <td style={{ padding: 10 }}>
                      <span style={{ padding: '2px 8px', borderRadius: 12, fontSize: 12,
                        background: isExp ? '#fde8e8' : '#e8f5e9', color: isExp ? '#c0392b' : '#27ae60' }}>
                        {isExp ? 'Expired' : 'Pending'}
                      </span>
                    </td>
                    <td style={{ padding: 10 }}>{isExp ? '—' : `${daysLeft}d`}</td>
                    <td style={{ padding: 10 }}>
                      <button onClick={() => handleResend(inv.id)} disabled={isExp} className="btn btn-secondary" style={{ marginRight: 6 }}>Resend</button>
                      <button onClick={() => handleRevokeInvite(inv.id)} className="btn btn-border">Revoke</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        }
      </div>

      {/* ===== Linked Guardians ===== */}
      <div>
        <h3 style={{ margin: '0 0 12px', color: 'var(--primary)' }}>
          {selectedChildInfo
            ? `Linked Guardians – ${selectedChildInfo.firstName} ${selectedChildInfo.lastName}`
            : 'Linked Guardians'}
        </h3>
        {linkedGuardians.length === 0 ? <p style={{ color: 'var(--text-light)' }}>No linked guardians for this child.</p> :
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead>
              <tr style={{ background: 'var(--bg-primary)' }}>
                <th style={{ padding: 10, textAlign: 'left' }}>Name</th>
                <th style={{ padding: 10, textAlign: 'left' }}>Email</th>
                <th style={{ padding: 10, textAlign: 'left' }}>Status</th>
                <th style={{ padding: 10, textAlign: 'left' }}>Permissions</th>
                <th style={{ padding: 10, textAlign: 'left' }}>Actions</th>
              </tr>
            </thead>
            <tbody>
              {linkedGuardians.map(g => {
                const permKeys = Object.keys(g.permissions || {}).filter(k => g.permissions[k]);
                return (
                  <tr key={g.id} style={{ borderTop: '1px solid var(--border)' }}>
                    <td style={{ padding: 10 }}>{g.name || '—'}</td>
                    <td style={{ padding: 10 }}>{g.email || '—'}</td>
                    <td style={{ padding: 10 }}>
                      <span style={{ padding: '2px 8px', borderRadius: 12, fontSize: 12,
                        background: g.status === 'active' ? '#e8eaf6' : '#ffebee', color: g.status === 'active' ? '#3f51b5' : '#c62828' }}>
                        {g.status}
                      </span>
                    </td>
                    <td style={{ padding: 10, fontSize: 13 }}>{permKeys.length} permissions</td>
                    <td style={{ padding: 10 }}>
                      <button onClick={() => window.gmOpenPermModal(g)} className="btn btn-secondary" style={{ marginRight: 6 }}>Edit</button>
                      <button onClick={() => window.gmOpenTransferModal(g)} className="btn btn-border" style={{ marginRight: 6 }}>Transfer</button>
                      <button onClick={() => {
                        if (confirm('Revoke this guardian?')) {
                          fetch(`/api/v2/guardians/children/${selectedChild}/guardians/${g.id}/revoke`, {
                            method: 'DELETE',
                            headers: { Authorization: `Bearer ${token}` },
                          }).then(() => setLinkedGuardians(lg => lg.filter(l => l.id !== g.id)));
                        }
                      }} className="btn btn-border">Revoke</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        }
      </div>

      {/* Message Toast */}
      {message.text && (
        <div style={{
          position: 'fixed', bottom: 20, right: 20, padding: '12px 18px', borderRadius: 10,
          background: message.type === 'success' ? '#a8c49d' : '#e8a5a5', color: '#3D4738',
          fontWeight: 600, boxShadow: '0 4px 12px rgba(0,0,0,.15)', zIndex: 9999
        }}>
          {message.text}
        </div>
      )}
    </div>
  );
}

// Mount the app
const root = document.getElementById('guardian-management-root');
if (root) {
  ReactDOM.createRoot(root).render(React.createElement(GuardianManagement));
}
</script>
</body>
</html>
