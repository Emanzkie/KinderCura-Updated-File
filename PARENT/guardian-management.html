<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Guardian Management - KinderCura</title>
  <link rel="stylesheet" href="/css/dashboard-new-styles.css">
  <link rel="stylesheet" href="/css/notifications-styles.css">
  <link rel="stylesheet" href="/notifications-card-ui.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/guardian-management.css">
</head>
<body>
<header class="top-nav">
  <div class="nav-container">
    <a href="/parent/dashboard.html" class="logo">
      <img src="/icons/logo.png" alt="KinderCura Logo" class="logo-img">
      <span class="logo-text"><span class="logo-kinder">Kinder</span><span class="logo-cura">Cura</span></span>
    </a>
    <nav class="main-nav">
      <a href="/parent/dashboard.html" class="nav-link">Dashboard</a>
      <a href="/parent/results.html" class="nav-link">Results</a>
      <a href="/parent/reports.html" class="nav-link">Reports</a>
      <a href="/parent/recommendations.html" class="nav-link">Recommendations</a>
      <a href="/parent/appointments.html" class="nav-link">Appointments</a>
      <a href="/parent/chat.html" class="nav-link">Chat</a>
      <a href="/parent/custom-questions.html" class="nav-link">Questions</a>
    </nav>
    <div class="nav-right">
      <button class="icon-btn notification-btn" onclick="openNotifications()">
        <img src="/icons/notif_bell.png" class="notification-icon" style="width:24px;height:24px;"> <span id="notifCount" class="notification-badge">0</span>
      </button>
      <button class="icon-btn profile-btn" onclick="toggleProfileMenu()">
        <img src="/icons/profile.png" class="profile-icon" id="navProfilePic">
      </button>
    </div>
  </div>
</header>

<main class="dashboard-container">
  <div id="guardian-management-root"></div>
</main>

<!-- ═══════════════════════════════════════════════════════════
     Permission Edit Modal
     ═══════════════════════════════════════════════════════════ -->
<div id="gmPermModal" style="display:none">
  <div id="gmPermOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;
    display:flex;align-items:center;justify-content:center"
    onclick="gmClosePermModal()"></div>
  <div id="gmPermContent" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:white;border-radius:15px;box-shadow:0 8px 36px rgba(0,0,0,.18);
    width:min(580px,94vw);max-height:86vh;overflow-y:auto;padding:28px;z-index:9001"
    role="dialog" aria-modal="true" aria-label="Edit Guardian Permissions">
    <button onclick="gmClosePermModal()"
      style="background:none;border:none;font-size:1.3rem;cursor:pointer;float:right;line-height:1"
      aria-label="Close">&times;</button>
    <h3 id="gmPermTitle" style="color:var(--primary);margin-bottom:6px"></h3>
    <p id="gmPermSub" style="color:var(--text-light);font-size:0.88rem;margin-bottom:18px"></p>
    <div id="gmPermToggles"></div>
    <div id="gmPermImpact" style="margin-top:14px;padding:10px 14px;background:var(--bg-primary);
      border:1px solid var(--border);border-radius:8px;font-size:0.86rem;color:var(--text-light)"></div>
    <div style="margin-top:22px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="gmClosePermModal()">Cancel</button>
      <button class="btn btn-primary" onclick="gmSavePerms()">Save Permissions</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     Transfer-Primary Confirmation Modal
     ═══════════════════════════════════════════════════════════ -->
<div id="gmTransferModal" style="display:none">
  <div id="gmTransferOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;
    display:flex;align-items:center;justify-content:center"
    onclick="gmCloseTransferModal()"></div>
  <div id="gmTransferContent" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:white;border-radius:15px;box-shadow:0 8px 36px rgba(0,0,0,.18);
    width:min(480px,94vw);padding:28px;z-index:9001"
    role="dialog" aria-modal="true" aria-label="Transfer Primary Guardian">
    <button onclick="gmCloseTransferModal()"
      style="background:none;border:none;font-size:1.3rem;cursor:pointer;float:right;line-height:1"
      aria-label="Close">&times;</button>
    <h3 style="color:var(--primary);margin-bottom:6px">Transfer Primary Guardian</h3>
    <p id="gmTransferBody" style="color:var(--text-light);font-size:0.9rem;margin-bottom:20px;line-height:1.6"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="gmCloseTransferModal()">Cancel</button>
      <button id="gmTransferConfirmBtn" class="btn btn-primary">Confirm Transfer</button>
    </div>
  </div>
</div>

<script src="/api.js"></script>
<script src="/notifications-card-ui.js"></script>

<!-- React + Babel (development, CDN) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" src="/js/parent/guardian-management.js"></script>
</body>
</html>
