<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KinderCura</title>
    <link rel="stylesheet" href="/css/auth-new-styles.css">
</head>
<!-- .auth-page opts this page into the shared auth design system defined at the
     bottom of auth-new-styles.css, the same one signup.html uses. -->
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-sidebar">
            <div class="sidebar-logo">
                <img src="/icons/logo.png" alt="KinderCura Logo" class="sidebar-logo-img">
                <h1><span class="logo-kinder">Kinder</span><span class="logo-cura">Cura</span></h1>
            </div>
            <p class="sidebar-tagline">Supporting Your Child's Development Journey</p>
            <div class="sidebar-features">
                <div class="feature"><span class="check-icon" aria-hidden="true">&#10003;</span><p>Comprehensive Screening</p></div>
                <div class="feature"><span class="check-icon" aria-hidden="true">&#10003;</span><p>Progress Tracking</p></div>
                <div class="feature"><span class="check-icon" aria-hidden="true">&#10003;</span><p>Expert Recommendations</p></div>
                <div class="feature"><span class="check-icon" aria-hidden="true">&#10003;</span><p>Appointment System</p></div>
            </div>
        </div>

        <div class="auth-form-section">
            <div class="form-container">
                <!-- Same shell the sign-up steps use: heading block, white card,
                     footer link. .onboarding-step carries no display rule of its
                     own, so unlike .form-step it needs no JS to stay visible. -->
                <div class="onboarding-step login-step">
                    <div class="form-header">
                        <h2>Welcome Back</h2>
                        <p>Sign in to your account to continue</p>
                    </div>

                    <div class="form-section onboarding-card">
                        <!-- display is toggled inline by login.js; the look comes from the classes -->
                        <div id="sessionMsg" class="auth-message auth-message--info" style="display:none;"></div>
                        <div id="errorMsg" class="auth-message auth-message--error" style="display:none;"></div>

                        <form id="loginForm">
                            <div class="form-group">
                                <label for="identifier">Username or Email</label>
                                <input type="text" id="identifier" placeholder="username or email@example.com" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" placeholder="Enter your password" required>
                            </div>
                            <div class="form-options">
                                <label class="checkbox-label" for="rememberMe">
                                    <input type="checkbox" id="rememberMe">
                                    <span>Remember me</span>
                                </label>
                                <a href="#" class="text-link">Forgot password?</a>
                            </div>
                            <button type="submit" id="submitBtn" class="btn btn-primary btn-full">Sign In</button>
                        </form>
                    </div>

                    <div class="form-footer">
                        <p>Don't have an account? <a href="signup.html">Sign up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="/js/auth/login.js"></script>
</body>
</html>
