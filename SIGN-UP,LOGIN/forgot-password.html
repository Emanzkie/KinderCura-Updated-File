<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - KinderCura</title>
    <link rel="stylesheet" href="/css/auth-new-styles.css">
</head>
<!-- Same shell as login.html: .auth-page opts into the shared auth design system. -->
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-sidebar">
            <div class="sidebar-logo">
                <img src="/icons/logo.png" alt="KinderCura Logo" class="sidebar-logo-img">
                <h1><span class="logo-kinder">Kinder</span><span class="logo-cura">Cura</span></h1>
            </div>
            <p class="sidebar-tagline">Supporting Your Child's Development Journey</p>
        </div>

        <div class="auth-form-section">
            <div class="form-container">
                <div class="onboarding-step login-step">
                    <div class="form-header">
                        <h2>Reset Your Password</h2>
                        <p id="resetIntro">Enter your account email and we'll send you a 6-digit reset code.</p>
                    </div>

                    <div class="form-section onboarding-card">
                        <!-- display is toggled inline by forgot-password.js -->
                        <div id="resetInfo" class="auth-message auth-message--info" role="status" aria-live="polite" style="display:none;"></div>
                        <div id="resetError" class="auth-message auth-message--error" role="alert" style="display:none;"></div>

                        <!-- Step 1: request a code -->
                        <form id="requestCodeForm" novalidate>
                            <div class="form-group">
                                <label for="resetEmail">Email</label>
                                <input type="email" id="resetEmail" placeholder="email@example.com" autocomplete="email" required>
                            </div>
                            <button type="submit" id="requestCodeBtn" class="btn btn-primary btn-full">Send Reset Code</button>
                        </form>

                        <!-- Step 2: enter the code and a new password -->
                        <form id="resetPasswordForm" novalidate style="display:none;">
                            <div class="form-group">
                                <label for="resetCode">6-digit code</label>
                                <input type="text" id="resetCode" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" placeholder="123456" required>
                            </div>
                            <div class="form-group">
                                <label for="resetNewPassword">New password</label>
                                <input type="password" id="resetNewPassword" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>
                            </div>
                            <div class="form-group">
                                <label for="resetConfirmPassword">Confirm new password</label>
                                <input type="password" id="resetConfirmPassword" minlength="8" autocomplete="new-password" placeholder="Re-enter the new password" required>
                            </div>
                            <button type="submit" id="resetPasswordBtn" class="btn btn-primary btn-full">Reset Password</button>
                            <p style="margin-top: 1rem; text-align: center;">
                                <a href="#" id="resendCodeLink" class="text-link">Send a new code</a>
                            </p>
                        </form>
                    </div>

                    <div class="form-footer">
                        <p>Remembered it? <a href="/login">Back to sign in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="/js/auth/forgot-password.js"></script>
</body>
</html>
